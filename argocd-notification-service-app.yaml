apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Praveenkumar76/URL-shortener-gitops.git'
    targetRevision: main
    path: notification-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: url-shortener-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
