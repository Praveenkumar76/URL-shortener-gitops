apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: url-shortener-staging

labels:
  - pairs:
      environment: staging

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: analytics-service-config
      data:
        NOTIFICATION_SERVICE_URL: http://notification-service.url-shortener-staging.svc.cluster.local
    target:
      kind: ConfigMap
      name: analytics-service-config
