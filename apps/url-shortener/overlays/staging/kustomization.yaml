apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: url-shortener-staging

labels:
  - pairs:
      environment: staging

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: url-shortener-config
      data:
        BASE_URL: http://url-shortener-svc.url-shortener-staging.svc.cluster.local
        LOG_LEVEL: debug
    target:
      kind: ConfigMap
      name: url-shortener-config
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: url-shortener-secret
      data:
        database-url: L2FwcC9kYXRhL3N0YWdpbmctdXJsLXNob3J0ZW5lci5kYg==
    target:
      kind: Secret
      name: url-shortener-secret
